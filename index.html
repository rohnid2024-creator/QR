<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>디지털 명함</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
    }
    .container {
      position: relative;
      width: 100%;
      max-width: 480px; /* 모바일 비율 최적화 */
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 화면에 꽉 차게 표시 (여백을 두려면 contain으로 변경) */
    }
    /* 하단 연락처 저장 버튼 스타일 */
    .save-btn {
      position: absolute;
      bottom: 8%; /* 영상 속 아이콘 위치에 맞게 % 조절 */
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      transition: transform 0.2s;
    }
    .save-btn:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 모바일 자동재생을 위해 muted, playsinline 속성 필수 -->
    <video src="video.mp4" autoplay loop muted playsinline></video>
    
    <!-- 클릭 시 contact.vcf 다운로드 및 연락처 앱 실행 -->
    <a href="contact.vcf" download="contact.vcf" class="save-btn">
      <span>📇</span> 연락처 저장하기
    </a>
  </div>

</body>
</html>
